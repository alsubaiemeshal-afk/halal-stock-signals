
name: US Stock Signals 24H

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: us-stock-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Telegram state
        uses: actions/cache/restore@v4
        with:
          path: .cache/telegram_state.json
          key: telegram-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            telegram-state-

      - name: Run stock scanner
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_SYMBOLS: '40'
          MAX_BAR_AGE_MINUTES: '3'
          POLL_SECONDS: '60'
          RUN_SECONDS: '210'
        run: python bot.py

      - name: Save Telegram state
        if: always() && hashFiles('.cache/telegram_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/telegram_state.json
          key: telegram-state-${{ github.run_id }}-${{ github.run_attempt }}
